[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "polars-leetspeak"
version = "0.1.0"
description = "A Polars expression plugin that converts strings to (and from) leetspeak."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konstantinos Tsoumas" }]
keywords = ["polars", "plugin", "leetspeak", "strings"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["polars >= 1.0.0"]

[project.urls]
Repository = "https://github.com/KonstantinosTsoumas/polars-leetspeak"

[tool.maturin]
module-name = "leetspeak._internal"
