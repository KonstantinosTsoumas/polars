name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2

      # The pure-logic crate has no Python or Polars dependency, so it can be
      # tested on its own before anything is compiled against pyo3.
      - name: Rust unit tests
        run: cargo test -p leetspeak-core

      - name: Build and install the plugin
        run: |
          pip install maturin pytest polars
          maturin develop

      - name: Python tests
        run: pytest tests/ -q

  build:
    name: Wheel (${{ matrix.platform.os }}-${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux,   runner: ubuntu-latest,  target: x86_64 }
          - { os: linux,   runner: ubuntu-latest,  target: aarch64 }
          - { os: macos,   runner: macos-13,       target: x86_64 }
          - { os: macos,   runner: macos-latest,   target: aarch64 }
          - { os: windows, runner: windows-latest, target: x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The crate is built with pyo3's `abi3-py310` feature, so a single wheel
      # per platform covers CPython 3.10 and every later version. Without abi3
      # this matrix would need one build per interpreter version.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          sccache: "true"
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build, sdist]
    environment: release
    permissions:
      # Required for PyPI trusted publishing; no API token needs to be stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
